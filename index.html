<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>qatual</title>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --miku: #39C5BB;
      --miku-glow: rgba(57, 197, 187, 0.45);
      --miku-border: rgba(57, 197, 187, 0.7);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #bg { position: fixed; inset: 0; z-index: 0; }

    #vizcanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #vizcanvas.active { opacity: 1; }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(4, 14, 18, 0.6);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 4px solid var(--miku-border);
      border-radius: 20px;
      padding: 90px 130px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(57,197,187,0.08) inset,
        0 30px 80px rgba(0,0,0,0.65),
        0 0 60px rgba(57,197,187,0.08);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pfp {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--miku);
      margin: 0 auto 24px;
      display: block;
    }

    .card h1 {
      font-family: 'Parkinsans', sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .card h1 span { font-weight: 300; opacity: 0.65; }

    .icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      margin-top: 30px;
    }

    .icons a, .icons button {
      color: rgba(255,255,255,0.45);
      font-size: 2rem;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), text-shadow 0.25s ease;
      display: inline-block;
      line-height: 1;
    }

    .icons a:hover, .icons button:hover {
      color: var(--miku);
      transform: scale(1.24);
      text-shadow: 0 0 14px var(--miku-glow);
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      background: #000;
      background-image: linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 24px 24px;
      border-bottom: 1px solid rgba(57,197,187,0.15);
      backdrop-filter: blur(24px);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);
    }

    #player.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .p-left {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 240px;
      flex-shrink: 0;
    }

    .p-cover {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      background: rgba(57,197,187,0.08);
      border: 1px solid rgba(57,197,187,0.15);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
    }

    .p-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .p-cover img.loaded { display: block; }

    .p-meta { min-width: 0; }

    .p-title {
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .p-artist {
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .p-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .p-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .p-controls button {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      padding: 0;
      transition: color 0.15s ease, transform 0.15s ease;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p-controls button:hover { color: #fff; transform: scale(1.1); }

    .p-controls .p-playpause {
      font-size: 1.1rem;
      color: #fff !important;
    }

    .p-controls .p-shuffle.on,
    .p-controls .p-repeat.on { color: var(--miku); }
    .p-controls button { color: rgba(255,255,255,0.5); }

    .p-seek {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }

    .p-time {
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
      width: 30px;
      text-align: center;
    }

    .p-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }

    .p-bar:hover .p-bar-fill::after { display: block; }

    .p-bar-fill {
      height: 100%;
      background: var(--miku);
      border-radius: 99px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }

    .p-bar-fill::after {
      content: '';
      display: none;
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    .p-right {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 240px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .p-right button {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 0.82rem;
      padding: 0;
      transition: color 0.15s ease;
      line-height: 1;
    }

    .p-right button:hover { color: #fff; }
    .p-right button.on { color: var(--miku); }

    .p-vol-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .p-vol-bar {
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }

    .p-vol-fill {
      height: 100%;
      background: #fff;
      border-radius: 99px;
      width: 80%;
      pointer-events: none;
    }

    .p-queue-panel {
      position: fixed;
      top: 80px;
      right: 18px;
      z-index: 70;
      width: 300px;
      background: rgba(4, 10, 14, 0.97);
      border: 1px solid rgba(57,197,187,0.2);
      border-radius: 12px;
      backdrop-filter: blur(24px);
      box-shadow: 0 -4px 40px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
      overflow: hidden;
    }

    .p-queue-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .q-header {
      padding: 16px 16px 8px;
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .q-list {
      max-height: 300px;
      overflow-y: auto;
      padding: 0 8px 12px;
    }

    .q-list::-webkit-scrollbar { width: 3px; }
    .q-list::-webkit-scrollbar-thumb { background: rgba(57,197,187,0.3); border-radius: 99px; }

    .q-track {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .q-track:hover { background: rgba(255,255,255,0.05); }
    .q-track.now { background: rgba(57,197,187,0.07); }

    .q-cover {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      background: rgba(57,197,187,0.08);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 0.7rem;
    }

    .q-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .q-cover img.loaded { display: block; }

    .q-meta { flex: 1; min-width: 0; }

    .q-name {
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-track.now .q-name { color: var(--miku); }

    .q-artist {
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.65rem;
      font-weight: 300;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: rgba(4, 14, 18, 0.9);
      border: 1px solid var(--miku-border);
      color: #fff;
      font-family: 'Parkinsans', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      padding: 5px 13px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s ease;
      backdrop-filter: blur(8px);
      transform: translate(-50%, -160%);
    }

    #tooltip.visible { opacity: 1; }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 8, 12, 0.75);
      backdrop-filter: blur(16px) brightness(0.55);
      -webkit-backdrop-filter: blur(16px) brightness(0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-text {
      font-family: 'Parkinsans', sans-serif;
      font-weight: 400;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.02em;
      animation: pulse 2.8s ease-in-out infinite;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="bg"></div>
  <canvas id="vizcanvas"></canvas>

  <div class="card">
    <img class="pfp" src="/pfp.png" alt="pfp" />
    <h1><span>hello, i'm </span>qatual.</h1>
    <div class="icons">
      <a href="#" data-tip="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="#" data-tip="Discord"><i class="fa-brands fa-discord"></i></a>
      <a href="#" data-tip="Steam"><i class="fa-brands fa-steam"></i></a>
      <a href="mailto:" data-tip="Email"><i class="fa-solid fa-envelope"></i></a>
      <a href="https://solocentral.org" target="_blank" data-tip="Solo Central"><i class="fa-solid fa-gamepad"></i></a>
    </div>
  </div>

  <div id="player">
    <div class="p-left">
      <div class="p-cover" id="pCover">
        <img id="pCoverImg" src="" alt="" />
        <i class="fa-solid fa-music"></i>
      </div>
      <div class="p-meta">
        <div class="p-title" id="pTitle">—</div>
        <div class="p-artist" id="pArtist">—</div>
      </div>

    </div>

    <div class="p-center">
      <div class="p-controls">
        <button class="p-shuffle" id="pShuffle" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button id="pPrev" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button class="p-playpause" id="pPlay"><i class="fa-solid fa-pause"></i></button>
        <button id="pNext" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        <button class="p-repeat" id="pRepeat" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="p-seek">
        <span class="p-time" id="pCurrent">0:00</span>
        <div class="p-bar" id="pBar"><div class="p-bar-fill" id="pFill"></div></div>
        <span class="p-time" id="pDuration">0:00</span>
      </div>
    </div>

    <div class="p-right">
      <button id="pQueueBtn" title="Queue"><i class="fa-solid fa-list"></i></button>
      <div class="p-vol-wrap">
        <button id="pVolBtn"><i class="fa-solid fa-volume-high"></i></button>
        <div class="p-vol-bar" id="pVolBar"><div class="p-vol-fill" id="pVolFill"></div></div>
      </div>
    </div>
  </div>

  <div class="p-queue-panel" id="queuePanel">
    <div class="q-header">tracks</div>
    <div class="q-list" id="qNow"></div>
    <div class="q-list" id="qNext"></div>
  </div>

  <div id="tooltip"></div>

  <div id="overlay">
    <span class="overlay-text">click to enter</span>
  </div>

  <audio id="music"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
  <script>
    VANTA.CELLS({
      el: "#bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      color1: 0x071a1f,
      color2: 0x39C5BB,
      size: 1.00,
      speed: 1.60
    });

    const audioEl = document.getElementById('music');
    let tracks = [];
    let currentIdx = 0;
    let shuffle = false;
    let repeat = false;
    let muted = false;
    let lastVol = 0.8;
    let vizStarted = false;

    function fmt(s) {
      if (isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    function setCover(src, imgEl, iconEl) {
      if (src) {
        imgEl.src = src;
        imgEl.onload = () => imgEl.classList.add('loaded');
        if (iconEl) iconEl.style.display = 'none';
      } else {
        imgEl.src = '';
        imgEl.classList.remove('loaded');
        if (iconEl) iconEl.style.display = '';
      }
    }

    function loadTrack(idx, autoplay) {
      if (!tracks.length) return;
      currentIdx = ((idx % tracks.length) + tracks.length) % tracks.length;
      const t = tracks[currentIdx];
      audioEl.src = t.src;
      audioEl.volume = lastVol;
      document.getElementById('pTitle').textContent = t.title;
      document.getElementById('pArtist').textContent = t.artist;
      document.getElementById('pFill').style.width = '0%';
      document.getElementById('pCurrent').textContent = '0:00';
      document.getElementById('pDuration').textContent = '0:00';
      const img = document.getElementById('pCoverImg');
      const icon = document.querySelector('.p-cover i');
      setCover(t.cover || '', img, icon);
      if (autoplay) {
        audioEl.play().catch(() => {});
        document.querySelector('#pPlay i').className = 'fa-solid fa-pause';
      }
      buildQueue();
    }

    function buildQueue() {
      if (!tracks.length) return;
      const nowEl = document.getElementById('qNow');
      const nextEl = document.getElementById('qNext');
      const t = tracks[currentIdx];

      nowEl.innerHTML = '';
      const nowRow = document.createElement('div');
      nowRow.className = 'q-track now';
      nowRow.innerHTML = `
        <div class="q-cover"><img src="${t.cover||''}" /><i class="fa-solid fa-music"></i></div>
        <div class="q-meta">
          <div class="q-name">${t.title}</div>
          <div class="q-artist">${t.artist}</div>
        </div>`;
      if (t.cover) {
        const img = nowRow.querySelector('img');
        img.onload = () => img.classList.add('loaded');
      }
      nowEl.appendChild(nowRow);

      nextEl.innerHTML = '';
      const upcoming = shuffle
        ? [...tracks].filter((_, i) => i !== currentIdx).sort(() => Math.random() - 0.5).slice(0, 6)
        : tracks.slice(currentIdx + 1).concat(tracks.slice(0, currentIdx)).slice(0, 8);

      upcoming.forEach((tr, i) => {
        const origIdx = tracks.indexOf(tr);
        const row = document.createElement('div');
        row.className = 'q-track';
        row.innerHTML = `
          <div class="q-cover"><img src="${tr.cover||''}" /><i class="fa-solid fa-music"></i></div>
          <div class="q-meta">
            <div class="q-name">${tr.title}</div>
            <div class="q-artist">${tr.artist}</div>
          </div>`;
        if (tr.cover) {
          const img = row.querySelector('img');
          img.onload = () => img.classList.add('loaded');
        }
        row.addEventListener('click', () => loadTrack(origIdx, true));
        nextEl.appendChild(row);
      });
    }

    fetch('/static/tracks.json')
      .then(r => r.json())
      .then(data => {
        tracks = data;
        loadTrack(0, false);
      })
      .catch(() => {
        tracks = [{ title: 'music', artist: 'qatual', src: '/static/music.mp3', cover: '' }];
        loadTrack(0, false);
      });

    document.getElementById('overlay').addEventListener('click', () => {
      document.getElementById('overlay').classList.add('hidden');
      if (tracks.length) audioEl.play().catch(() => {});
      document.getElementById('player').classList.add('visible');
      document.querySelector('#pPlay i').className = 'fa-solid fa-pause';
      if (!vizStarted) { vizStarted = true; startViz(); }
    });

    document.getElementById('pPlay').addEventListener('click', () => {
      const icon = document.querySelector('#pPlay i');
      if (audioEl.paused) {
        audioEl.play();
        icon.className = 'fa-solid fa-pause';
      } else {
        audioEl.pause();
        icon.className = 'fa-solid fa-play';
      }
    });

    document.getElementById('pPrev').addEventListener('click', () => {
      if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; }
      loadTrack(currentIdx - 1, true);
    });

    document.getElementById('pNext').addEventListener('click', () => {
      if (shuffle) {
        loadTrack(Math.floor(Math.random() * tracks.length), true);
      } else {
        loadTrack(currentIdx + 1, true);
      }
    });

    audioEl.addEventListener('ended', () => {
      if (repeat) { audioEl.currentTime = 0; audioEl.play(); return; }
      if (shuffle) { loadTrack(Math.floor(Math.random() * tracks.length), true); }
      else { loadTrack(currentIdx + 1, true); }
    });

    document.getElementById('pShuffle').addEventListener('click', (e) => {
      shuffle = !shuffle;
      e.currentTarget.classList.toggle('on', shuffle);
    });

    document.getElementById('pRepeat').addEventListener('click', (e) => {
      repeat = !repeat;
      e.currentTarget.classList.toggle('on', repeat);
    });

    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      document.getElementById('pFill').style.width = pct + '%';
      document.getElementById('pCurrent').textContent = fmt(audioEl.currentTime);
      document.getElementById('pDuration').textContent = fmt(audioEl.duration);
    });

    document.getElementById('pBar').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audioEl.currentTime = pct * (audioEl.duration || 0);
    });

    document.getElementById('pVolBtn').addEventListener('click', () => {
      muted = !muted;
      audioEl.volume = muted ? 0 : lastVol;
      document.getElementById('pVolFill').style.width = muted ? '0%' : (lastVol * 100) + '%';
      document.querySelector('#pVolBtn i').className = muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
    });

    document.getElementById('pVolBar').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      lastVol = pct;
      audioEl.volume = pct;
      muted = false;
      document.getElementById('pVolFill').style.width = (pct * 100) + '%';
      document.querySelector('#pVolBtn i').className = pct === 0 ? 'fa-solid fa-volume-xmark' : pct < 0.4 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high';
    });

    document.getElementById('pQueueBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const panel = document.getElementById('queuePanel');
      const btn = document.getElementById('pQueueBtn');
      panel.classList.toggle('open');
      btn.classList.toggle('on', panel.classList.contains('open'));
    });

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('queuePanel');
      if (!panel.contains(e.target) && e.target !== document.getElementById('pQueueBtn')) {
        panel.classList.remove('open');
        document.getElementById('pQueueBtn').classList.remove('on');
      }
    });

    function startViz() {
      const canvas = document.getElementById('vizcanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.add('active');
      const ctx = canvas.getContext('2d');

      const context = new AudioContext();
      const src = context.createMediaElementSource(audioEl);
      const analyser = context.createAnalyser();
      src.connect(analyser);
      analyser.connect(context.destination);
      analyser.fftSize = 256;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      function render() {
        requestAnimationFrame(render);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / bufferLength) * 1.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i] * 1.5;
          const t = dataArray[i] / 255;
          const r = Math.round(0 + t * 10);
          const g = Math.round(60 + t * 180);
          const b = Math.round(60 + t * 185);
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      render();
    }

    const tooltip = document.getElementById('tooltip');
    let tipX = 0, tipY = 0, curX = 0, curY = 0;

    document.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        tooltip.textContent = el.dataset.tip;
        tooltip.classList.add('visible');
      });
      el.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
      });
    });

    document.addEventListener('mousemove', e => {
      curX = e.clientX;
      curY = e.clientY;
    });

    (function animateTip() {
      tipX += (curX - tipX) * 0.12;
      tipY += (curY - tipY) * 0.12;
      tooltip.style.left = tipX + 'px';
      tooltip.style.top  = tipY + 'px';
      requestAnimationFrame(animateTip);
    })();
  </script>
</body>
</html>
